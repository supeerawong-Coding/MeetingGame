<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATHENA — Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">ATHENA</a>
    <span class="badge">Admin</span>
    <div class="topbar-actions">
      <a class="btn btn-sm btn-ghost" href="host.html">Host</a>
      <button class="btn btn-sm btn-ghost" id="btn-logout" hidden>ออกจากระบบ</button>
    </div>
  </header>

  <main>

    <!-- ============================== LOGIN ============================== -->
    <section id="screen-login" class="login-screen">
      <form id="login-form" class="login-card">
        <div class="login-mark">A</div>
        <h1>เข้าสู่ระบบ</h1>

        <div class="field">
          <label for="login-username">Username</label>
          <input class="input" id="login-username" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input class="input" id="login-password" type="password" autocomplete="current-password" required>
        </div>

        <p class="form-error" id="login-error" hidden>Username หรือ Password ไม่ถูกต้อง</p>

        <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
      </form>
    </section>

    <!-- =============================== APP =============================== -->
    <div id="admin-app" class="admin-grid" hidden>

      <section class="panel panel-col">
        <div class="panel-head">
          <h2>ชุดข้อสอบ</h2>
          <button id="btn-new-quiz" class="btn btn-primary btn-sm">+ ใหม่</button>
        </div>
        <ul id="quiz-list" class="list"></ul>
        <p id="quiz-empty" class="empty" hidden>ยังไม่มีชุดข้อสอบ</p>
      </section>

      <section class="panel panel-col">
        <div class="panel-head">
          <h2>คำถาม <span id="questions-quiz-name" class="muted"></span></h2>
          <button id="btn-new-question" class="btn btn-primary btn-sm" disabled>+ ใหม่</button>
        </div>
        <p id="no-quiz-hint" class="empty">เลือกชุดข้อสอบทางซ้าย</p>
        <ol id="question-list" class="list"></ol>
        <p id="question-empty" class="empty" hidden>ยังไม่มีคำถาม</p>
      </section>
    </div>
  </main>

  <!-- =========================== ฟอร์มชุดข้อสอบ ========================= -->
  <dialog id="quiz-dialog" class="modal">
    <form id="quiz-form" class="form modal-card">
      <h2 class="modal-title" id="quiz-dialog-title">ชุดข้อสอบ</h2>
      <input type="hidden" id="quiz-id">

      <div class="field">
        <label for="quiz-title">ชื่อชุดข้อสอบ</label>
        <input class="input" id="quiz-title" type="text" maxlength="120" required>
      </div>

      <div class="field">
        <label for="quiz-description">คำอธิบาย</label>
        <textarea class="input" id="quiz-description" maxlength="400" rows="2"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="quiz-time-limit">เวลาตอบ (วินาที)</label>
          <select class="input" id="quiz-time-limit">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
          </select>
        </div>
        <div class="field">
          <label for="quiz-points">คะแนนต่อข้อ</label>
          <input class="input" id="quiz-points" type="number" min="100" max="10000" step="100" value="1000">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">บันทึก</button>
        <button type="button" id="quiz-cancel" class="btn">ยกเลิก</button>
      </div>
    </form>
  </dialog>

  <!-- =========================== ฟอร์มคำถาม ============================= -->
  <dialog id="question-dialog" class="modal">
    <form id="question-form" class="form modal-card">
      <h2 class="modal-title" id="question-dialog-title">คำถาม</h2>
      <input type="hidden" id="question-id">

      <div class="field">
        <label for="question-text">คำถาม</label>
        <textarea class="input" id="question-text" maxlength="500" rows="2" required></textarea>
      </div>

      <div class="option-grid">
        <div class="option-cell option-cell--0">
          <span class="shape shape-triangle"></span>
          <input class="input option-text" id="option-0" type="text" maxlength="160" placeholder="A" required>
        </div>
        <div class="option-cell option-cell--1">
          <span class="shape shape-diamond"></span>
          <input class="input option-text" id="option-1" type="text" maxlength="160" placeholder="B" required>
        </div>
        <div class="option-cell option-cell--2">
          <span class="shape shape-circle"></span>
          <input class="input option-text" id="option-2" type="text" maxlength="160" placeholder="C" required>
        </div>
        <div class="option-cell option-cell--3">
          <span class="shape shape-square"></span>
          <input class="input option-text" id="option-3" type="text" maxlength="160" placeholder="D" required>
        </div>
      </div>

      <div class="field">
        <label>ข้อที่ถูกต้อง</label>
        <div class="correct-options">
          <label class="correct-chip"><input type="radio" name="correct" value="0" checked> A</label>
          <label class="correct-chip"><input type="radio" name="correct" value="1"> B</label>
          <label class="correct-chip"><input type="radio" name="correct" value="2"> C</label>
          <label class="correct-chip"><input type="radio" name="correct" value="3"> D</label>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="question-points">คะแนน</label>
          <input class="input" id="question-points" type="number" min="100" max="10000" step="100" value="1000">
        </div>
        <div class="field">
          <label for="question-time-limit">เวลา (วินาที)</label>
          <select class="input" id="question-time-limit">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
          </select>
        </div>
        <div class="field">
          <label for="question-order">ลำดับ</label>
          <input class="input" id="question-order" type="number" min="0" step="1" value="0">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">บันทึก</button>
        <button type="button" id="question-cancel" class="btn">ยกเลิก</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/athena.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
